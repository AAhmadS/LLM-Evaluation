[tool.poetry]
name = "LLM-Evaluation"
version = "0.1.0"
description = "For the paper: Can LLMs be Reliable Evaluators?"
authors = ["Amirahmad Shafiee  <amirahmad.shafiee@sharif.edu>"]

[tool.poetry.dependencies]
python = "^3.12"
python-dotenv = "^1.0.1"
sentence-transformers = "^3.0.0"
openai = "^1.55.3"
transformers = ">=4.47.1"
datasets = "^3.2.0"
accelerate = ">=1.2.1"
mistralai = ">=1.3.1"
llamaapi = ">=0.1.36"
seaborn = "^0.13.2"
matplotlib = "^3.10.0"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"

[tool.pyright]
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md
useLibraryCodeForTypes = true
exclude = [".cache"]

[tool.ruff]
# https://beta.ruff.rs/docs/configuration/
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'ARG', 'SIM']
ignore = ['W291', 'W292', 'W293']

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api" 
